<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISBAT University | Student Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header, footer {
            background-color: #800000;
            color: white;
            text-align: center;
            padding: 1rem;
        }
        nav {
            background-color: #333;
            padding: 0.5rem;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        form {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        fieldset {
            border: 1px solid #ccc;
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        legend {
            font-weight: bold;
            color: #800000;
            padding: 0 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .radio-group label,
        .checkbox-group label {
            display: inline;
            font-weight: normal;
            margin-left: 5px;
            margin-right: 15px;
        }
        .button-group {
            text-align: center;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background-color: #800000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button[type="reset"] {
            background-color: #6c757d;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <h1>ISBAT University</h1>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#programmes">Programmes</a>
        <a href="#contact">Contact</a>
    </nav>

    <main>
        <form action="#" method="POST">
            <!-- Personal Details Fieldset -->
            <fieldset>
                <legend>Personal Details</legend>
                
                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="form-group">
                    <label for="studentid">Student ID (Format: ISB-XXXXX):</label>
                    <input type="text" id="studentid" name="studentid" pattern="^ISB-\d{5}$" placeholder="ISB-12345" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number (Format: 07XXXXXXXX):</label>
                    <input type="tel" id="phone" name="phone" pattern="^07\d{8}$" placeholder="0712345678" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label>Gender:</label>
                    <div class="radio-group">
                        <input type="radio" id="male" name="gender" value="Male" required>
                        <label for="male">Male</label>
                        
                        <input type="radio" id="female" name="gender" value="Female">
                        <label for="female">Female</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="nationality">Nationality:</label>
                    <select id="nationality" name="nationality" required>
                        <option value="">--Select Nationality--</option>
                        <option value="Uganda">Uganda</option>
                        <option value="Kenya">Kenya</option>
                        <option value="Tanzania">Tanzania</option>
                        <option value="Rwanda">Rwanda</option>
                        <option value="South Sudan">South Sudan</option>
                    </select>
                </div>
            </fieldset>

            <!-- Programme Details Fieldset -->
            <fieldset>
                <legend>Programme Details</legend>
                <div class="form-group">
                    <label for="programme">Programme of Study:</label>
                    <select id="programme" name="programme" required>
                        <option value="">--Select Programme--</option>
                        <option value="BCIS">Bachelor of Computer and Information Science (BCIS)</option>
                        <option value="BIT">Bachelor of Information Technology (BIT)</option>
                        <option value="BSE">Bachelor of Software Engineering (BSE)</option>
                        <option value="BBAM">Bachelor of Business Administration and Management (BBAM)</option>
                    </select>
                </div>
            </fieldset>

            <!-- Course Units Fieldset -->
            <fieldset>
                <legend>Course Units (First Semester)</legend>
                <div class="form-group">
                    <label>Select at least 5 course units:</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="unit1" name="units" value="BIT1101">
                        <label for="unit1">BIT1101 - Introduction to Web Design</label><br>

                        <input type="checkbox" id="unit2" name="units" value="BIT1102">
                        <label for="unit2">BIT1102 - Fundamentals of Programming</label><br>

                        <input type="checkbox" id="unit3" name="units" value="BIT1103">
                        <label for="unit3">BIT1103 - Computer Architecture</label><br>

                        <input type="checkbox" id="unit4" name="units" value="BIT1104">
                        <label for="unit4">BIT1104 - Mathematics for Computing</label><br>

                        <input type="checkbox" id="unit5" name="units" value="BIT1105">
                        <label for="unit5">BIT1105 - Communication Skills</label>
                    </div>
                </div>
            </fieldset>

            <div class="button-group">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 ISBAT University | Reg No: 012250493</p>
    </footer>

</body>
</html>
